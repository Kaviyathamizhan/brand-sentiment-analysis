services:
  - type: web
    name: brand-sentiment-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt && python -u backend/download_models.py"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
