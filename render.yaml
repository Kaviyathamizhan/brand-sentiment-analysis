services:
  - type: web
    name: brand-sentiment-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt && python backend/download_models.py"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
